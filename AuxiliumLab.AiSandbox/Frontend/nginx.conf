server {
    listen 80;

    # Serve Blazor WASM static files; fall back to index.html for SPA routes.
    location / {
        root  /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Disable caching for the entrypoint and the runtime config file so that
    # environment-injected settings (AISANDBOX_BASE_URL) are always fresh.
    location ~* /(index\.html|appsettings.*\.json)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }
}
