# docker-compose.yml
#
# Two services:
#   rl-service        — Python / Stable Baselines 3 policy trainer (gRPC :50051)
#   aisandbox-startup — .NET 9 backend: REST :5000, gRPC gym :50062
#
# The Blazor WebAssembly frontend (AuxiliumLab.Frontend) is NOT run in Docker.
# Start it locally on the developer machine with:
#   cd AuxiliumLab.AiSandbox/Frontend/AuxiliumLab.Frontend
#   dotnet run
# The frontend reaches the backend at http://localhost:5000.
#
# Quick start:
#   docker compose build
#   docker compose up -d

services:

  # ─────────────────────────────────────────────────────────────────────────
  # RL training service (Python)
  # ─────────────────────────────────────────────────────────────────────────
  rl-service:
    build:
      context: ./auxiliumlab-rl-service-baselines3
    user: root
    ports:
      - "50051:50051"
    environment:
      GRPC_HOST: "0.0.0.0"
      GRPC_PORT: "50051"
      SIMULATION_GRPC_HOST: "aisandbox-startup:50062"
    volumes:
      - rl-models:/app/trained_models
      - rl-checkpoints:/app/checkpoints
      - C:/FILE_STORAGE:/file-storage
    healthcheck:
      test: ["CMD", "python", "healthcheck.py", "--host", "localhost", "--port", "50051"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────────────────────────────────────
  # .NET backend  (REST + gRPC gym host)
  # ─────────────────────────────────────────────────────────────────────────
  aisandbox-startup:
    build:
      context: ./AuxiliumLab.AiSandbox
    ports:
      - "5000:5000"    # REST / Swagger / SignalR
      - "50062:50062"  # gRPC gym endpoint (Python calls in here)
    environment:
      # Override the Windows default path from appsettings.json
      FileSource__FileStorage__BasePath: /file-storage
      # Point at the rl-service container (service name resolves via Docker DNS)
      PolicyTrainerClient__ServerAddress: http://rl-service:50051
    volumes:
      - C:/FILE_STORAGE:/file-storage
    depends_on:
      rl-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/5000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  rl-models:
  rl-checkpoints:
